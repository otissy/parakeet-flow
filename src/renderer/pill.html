<!doctype html>
<html><head><meta charset="utf-8"><title>Flow bar</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="pill.css">
</head><body>
<div id="stage">
  <div id="pill" class="idle">
    <button id="cancel" class="btn" title="Cancel (Esc)" aria-label="Cancel"><i data-icon="close"></i></button>
    <div id="body">
      <canvas id="wave" width="120" height="28"></canvas>
      <div id="mark" aria-hidden="true"><i data-icon="check" class="ok"></i><i data-icon="close" class="no"></i></div>
      <div id="text"></div>
    </div>
    <button id="stop" class="btn" title="Stop" aria-label="Stop"><i data-icon="stop"></i></button>
  </div>
  <div id="note"></div>
  <div id="flags" aria-live="polite"></div>
</div>
<script src="icons.js"></script>
<script src="pill.js"></script>
</body></html>
